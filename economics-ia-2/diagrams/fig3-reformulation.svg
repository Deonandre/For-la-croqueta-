  <text x="215" y="84" font-size="11.5" fill="#6b7280" text-anchor="start"><tspan>UK levy: sugar content of soft drinks</tspan></text>
  <text x="215" y="100" font-size="11.5" fill="#6b7280" text-anchor="start"><tspan>down 47% between 2015 and 2024</tspan></text>
