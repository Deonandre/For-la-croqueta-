  <text x="350" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">Figure 3: The market for reformulated low-sugar drinks</text>
  <text x="350" y="45" text-anchor="middle" font-size="12.5" fill="#4b5563">A tiered levy is avoidable, so producers cut sugar and supply of reformulated drinks rises</text>
