<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 490" width="700" height="490" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="490" fill="#ffffff"/>
  <defs>
    <marker id="ax" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#1f2937"/>
    </marker>
    <marker id="gr" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#059669"/>
