  </defs>
  <text x="350" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">Figure 1: Negative externality of consumption in the SSB market</text>
  <text x="350" y="45" text-anchor="middle" font-size="12.5" fill="#4b5563">MPB exceeds MSB, so the free market over-allocates resources to sugary drinks</text>
  <line x1="95" y1="400" x2="645" y2="400" stroke="#1f2937" stroke-width="2" marker-end="url(#ax)"/>
  <line x1="95" y1="400" x2="95" y2="58" stroke="#1f2937" stroke-width="2" marker-end="url(#ax)"/>
  <text x="34" y="230" font-size="12.5" fill="#111827" transform="rotate(-90 34 230)" text-anchor="middle">Price, costs and benefits (€ per litre)</text>
  <text x="372" y="466" font-size="12.5" fill="#111827" text-anchor="middle">Quantity of sugar-sweetened beverages (litres per year)</text>
  <text x="89" y="415" font-size="12" fill="#111827" text-anchor="end">0</text>
  <path d="M325,265 L380,234 L380,304 Z" fill="#fca5a5" fill-opacity="0.6" stroke="none"/>
  <line x1="95" y1="265" x2="325" y2="265" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="325" y1="265" x2="325" y2="400" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="95" y1="234" x2="380" y2="234" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="380" y1="234" x2="380" y2="400" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="120" y1="380" x2="600" y2="110" stroke="#c2410c" stroke-width="2.6"/>
  <line x1="150" y1="70" x2="600" y2="390" stroke="#1d4ed8" stroke-width="2.6"/>
  <line x1="150" y1="140" x2="516" y2="400" stroke="#7c3aed" stroke-width="2.6" stroke-dasharray="7 4"/>
  <text x="596" y="98" font-size="12.5" font-weight="bold" fill="#c2410c" text-anchor="end"><tspan>S = MPC = MSC</tspan></text>
  <text x="158" y="64" font-size="12.5" font-weight="bold" fill="#1d4ed8" text-anchor="start"><tspan>MPB = D</tspan></text>
  <text x="158" y="132" font-size="12.5" font-weight="bold" fill="#7c3aed" text-anchor="start"><tspan>MSB</tspan></text>
  <line x1="450" y1="285" x2="450" y2="351" stroke="#111827" stroke-width="1.4" marker-start="url(#d1)" marker-end="url(#d1)"/>
  <text x="458" y="322" font-size="11.5" fill="#111827" text-anchor="start"><tspan>MEC</tspan></text>
  <line x1="428" y1="246" x2="382" y2="261" stroke="#991b1b" stroke-width="1.2"/>
  <text x="432" y="243" font-size="11.5" fill="#991b1b" text-anchor="start"><tspan>welfare loss</tspan></text>
  <circle cx="380" cy="234" r="4.5" fill="#111827"/>
  <circle cx="325" cy="265" r="4.5" fill="#111827"/>
  <text x="325" y="418" font-size="12.5" font-weight="bold" fill="#111827" text-anchor="middle"><tspan>Q*</tspan></text>
  <text x="380" y="418" font-size="12.5" font-weight="bold" fill="#111827" text-anchor="middle"><tspan>Q</tspan><tspan font-size="9.0" dy="4">m</tspan><tspan dy="-4"></tspan></text>
  <line x1="325" y1="431" x2="380" y2="431" stroke="#065f46" stroke-width="1.5"/>
