  <text x="430" y="66" font-size="13" font-weight="bold" fill="#b91c1c" text-anchor="start"><tspan>S</tspan><tspan font-size="9.5" dy="4">2</tspan><tspan dy="-4"></tspan><tspan> = S</tspan><tspan font-size="9.5" dy="4">1</tspan><tspan dy="-4"></tspan><tspan> + tax</tspan></text>
  <text x="596" y="102" font-size="13" font-weight="bold" fill="#c2410c" text-anchor="end"><tspan>S</tspan><tspan font-size="9.5" dy="4">1</tspan><tspan dy="-4"></tspan></text>
  <text x="606" y="388" font-size="12.5" font-weight="bold" fill="#1d4ed8" text-anchor="start"><tspan>D = MPB</tspan></text>
