  <line x1="95" y1="261" x2="331" y2="261" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="331" y1="261" x2="331" y2="400" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>
