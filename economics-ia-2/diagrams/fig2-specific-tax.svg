  <text x="89" y="238" font-size="12.5" font-weight="bold" fill="#111827" text-anchor="end"><tspan>P</tspan><tspan font-size="9.0" dy="4">1</tspan><tspan dy="-4"></tspan></text>
  <text x="89" y="265" font-size="12.5" font-weight="bold" fill="#111827" text-anchor="end"><tspan>P</tspan><tspan font-size="9.0" dy="4">3</tspan><tspan dy="-4"></tspan></text>
  <text x="331" y="418" font-size="12.5" font-weight="bold" fill="#111827" text-anchor="middle"><tspan>Q*</tspan></text>
