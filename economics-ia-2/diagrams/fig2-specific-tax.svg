  <text x="350" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">Figure 2: A specific tax on sugar-sweetened beverages</text>
  <text x="350" y="45" text-anchor="middle" font-size="12.5" fill="#4b5563">The levy internalises the external cost; the shaded area is government tax revenue</text>
  <line x1="95" y1="400" x2="645" y2="400" stroke="#1f2937" stroke-width="2" marker-end="url(#ax)"/>
  <line x1="95" y1="400" x2="95" y2="58" stroke="#1f2937" stroke-width="2" marker-end="url(#ax)"/>
  <text x="34" y="230" font-size="12.5" fill="#111827" transform="rotate(-90 34 230)" text-anchor="middle">Price (€ per litre)</text>
  <text x="372" y="466" font-size="12.5" fill="#111827" text-anchor="middle">Quantity of sugar-sweetened beverages (litres per year)</text>
  <text x="89" y="415" font-size="12" fill="#111827" text-anchor="end">0</text>
